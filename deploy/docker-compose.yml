version: "3.8"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: xlog
      POSTGRES_PASSWORD: xlog_password
      POSTGRES_DB: xlog
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xlog"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://xlog:xlog_password@db:5432/xlog
      NEXTAUTH_SECRET: change-this-to-a-random-secret
      NEXTAUTH_URL: http://localhost:3000
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Optional: Redis for session storage
  # redis:
  # image: redis:7-alpine
  # ports:
  # - "6379:6379"
  # volumes:
  # - redis_data:/data
  # healthcheck:
  # test: ["CMD", "redis-cli", "ping"]
  # interval: 10s
  # timeout: 5s
  # retries: 5

volumes:
  postgres_data:
  # redis_data:
